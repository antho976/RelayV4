name: Mobile APK

# Builds an installable Android APK of apps/relay-mobile on GitHub's runners, which ship
# with the Android SDK and NDK. Run it manually from the Actions tab, or push a tag such as
# mobile-v0.10.0 to build and attach the APK to a GitHub release.
#
# The engine, bus and CLI are checked by ci.yml; the desktop client cannot be built on
# these runners (see the note at the bottom of ci.yml). This job is the phone's build.
#
# Signing: by default the APK is signed with the standard Android debug key,
# which installs fine but cannot update an APK signed with a different key.
# To sign with your own key, add these repository secrets:
#   ANDROID_KEYSTORE_BASE64  - your .keystore/.jks file, base64 encoded
#   ANDROID_KEYSTORE_PASSWORD
#   ANDROID_KEY_ALIAS
#   ANDROID_KEY_PASSWORD

on:
    workflow_dispatch:
        inputs:
            architectures:
                description: 'CPU architectures to build (comma separated: arm64-v8a, armeabi-v7a, x86_64, x86)'
                required: true
                default: 'arm64-v8a'
    push:
        tags:
            - 'mobile-v*'
        # A manual run is only offered once this file is on the default branch. Until then, and
        # for a branch that wants an APK without a tag, a push whose message contains `[apk]`
        # builds one (the job-level `if` below skips every other push).
        branches:
            - '**'
        paths:
            - 'apps/relay-mobile/**'
            - '.github/workflows/mobile-apk.yml'

permissions:
    contents: write

jobs:
    build-apk:
        if: ${{ github.event_name != 'push' || github.ref_type == 'tag' || contains(github.event.head_commit.message, '[apk]') }}
        # One APK build per branch at a time; a newer build supersedes the one still compiling.
        # This sits on the job, not the workflow: a push without `[apk]` skips the job and so
        # must not cancel a build that is running.
        concurrency:
            group: mobile-apk-${{ github.ref }}
            cancel-in-progress: true
        runs-on: ubuntu-latest
        timeout-minutes: 120
        env:
            # arm64-v8a is every phone sold in the last decade; armeabi-v7a doubles the native
            # build for devices that could not run an on-device model anyway.
            ARCHS: ${{ github.event.inputs.architectures || 'arm64-v8a' }}
            # cui-llama.rn ships no prebuilt libraries in this version and compiles llama.cpp
            # once per CPU-feature variant. All seven variants for two ABIs took the runner
            # down after 70 minutes. Three cover the fleet: the generic library every device
            # loads, dotprod for phones from ~2018, and dotprod+i8mm for those from ~2020.
            # The loader in RNLlama.java falls back from the fastest present to the generic
            # one, so a phone never sees a missing variant.
            RNLLAMA_VARIANTS: rnllama,rnllama_v8_2_dotprod,rnllama_v8_2_dotprod_i8mm
            HAS_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
        defaults:
            run:
                working-directory: apps/relay-mobile
        steps:
            - name: Checkout
              uses: actions/checkout@v4

            # The runner image leaves about 20 GB free, and three llama.cpp variants with
            # debug info plus the app's own build filled it: the first full build died in
            # the last packaging step with "No space left on device". Drop the toolchains
            # this job never touches (.NET, Haskell, CodeQL, Swift, cached Docker images).
            - name: Free disk space
              working-directory: /
              run: |
                  df -h / | tail -n 1
                  sudo rm -rf /usr/share/dotnet \
                      /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL \
                      /usr/share/swift /usr/local/share/powershell /usr/local/julia* \
                      /usr/lib/jvm/temurin-8-jdk-amd64 /usr/lib/jvm/temurin-11-jdk-amd64 \
                      /usr/lib/jvm/temurin-21-jdk-amd64 /usr/local/lib/android/sdk/ndk/26.* \
                      /usr/local/lib/android/sdk/ndk/25.* 2>/dev/null || true
                  sudo docker image prune --all --force >/dev/null 2>&1 || true
                  df -h / | tail -n 1

            - name: Set up JDK 17
              uses: actions/setup-java@v4
              with:
                  distribution: temurin
                  java-version: '17'

            - name: Set up Node
              uses: actions/setup-node@v4
              with:
                  node-version: '22'
                  cache: npm
                  cache-dependency-path: apps/relay-mobile/package-lock.json

            - name: Set up Gradle cache
              uses: gradle/actions/setup-gradle@v4

            # Every native compile goes through ccache (see the build step), so a rebuild that
            # leaves llama.cpp alone compiles almost none of it. A cache saved on the default
            # branch is restored by every branch; one saved on a branch, only by that branch.
            - name: Set up compiler cache
              uses: hendrikmuhs/ccache-action@v1.2
              with:
                  key: mobile-apk-${{ env.ARCHS }}
                  max-size: 2G

            - name: Install dependencies
              run: npm ci

            - name: Generate native project
              run: npx expo prebuild --platform android --no-install

            - name: Configure release signing
              if: ${{ env.HAS_KEYSTORE == 'true' }}
              env:
                  KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
                  KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
                  KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
                  KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
              run: |
                  echo "$KEYSTORE_BASE64" | base64 -d > android/app/release.keystore
                  cat >> android/gradle.properties <<EOF
                  RELEASE_STORE_FILE=release.keystore
                  RELEASE_STORE_PASSWORD=$KEYSTORE_PASSWORD
                  RELEASE_KEY_ALIAS=$KEY_ALIAS
                  RELEASE_KEY_PASSWORD=$KEY_PASSWORD
                  EOF
                  node - <<'EOF'
                  const fs = require('fs')
                  const file = 'android/app/build.gradle'
                  let gradle = fs.readFileSync(file, 'utf8')
                  gradle = gradle.replace(
                      /signingConfigs \{\n(\s+)debug \{/,
                      (match, indent) =>
                          `signingConfigs {\n${indent}release {\n` +
                          `${indent}    storeFile file(RELEASE_STORE_FILE)\n` +
                          `${indent}    storePassword RELEASE_STORE_PASSWORD\n` +
                          `${indent}    keyAlias RELEASE_KEY_ALIAS\n` +
                          `${indent}    keyPassword RELEASE_KEY_PASSWORD\n` +
                          `${indent}}\n${indent}debug {`
                  )
                  // Only the release *build type* switches keys. Searching the whole file would
                  // match the signing config inserted above and re-key the debug build type.
                  const types = gradle.indexOf('buildTypes {')
                  gradle =
                      gradle.slice(0, types) +
                      gradle
                          .slice(types)
                          .replace(
                              /release \{\n([\s\S]*?)signingConfig signingConfigs\.debug/,
                              (match, body) => `release {\n${body}signingConfig signingConfigs.release`
                          )
                  const release = gradle.slice(gradle.indexOf('buildTypes {')).match(/release \{[\s\S]*?\n\s*\}/)
                  if (types < 0 || !release || !release[0].includes('signingConfigs.release')) {
                      console.error('Could not point the release build type at the release key')
                      process.exit(1)
                  }
                  fs.writeFileSync(file, gradle)
                  console.log('Release signing configured')
                  EOF

            - name: Build release APK
              working-directory: apps/relay-mobile/android
              env:
                  # Gradle installs the NDK afresh on every run, so its compilers always have a
                  # new timestamp, and ccache's default check (mtime) missed every object of
                  # every build. Hash the compiler's contents instead. With debug info ccache
                  # also hashes the build directory; leave it out so a CMake build directory
                  # that moves (new arguments, new hash) still hits.
                  CCACHE_COMPILERCHECK: content
                  CCACHE_NOHASHDIR: 'true'
                  # cui-llama.rn finds ccache on PATH by itself; these put the app's own native
                  # code, reanimated and the Expo modules through it too.
                  CMAKE_C_COMPILER_LAUNCHER: ccache
                  CMAKE_CXX_COMPILER_LAUNCHER: ccache
              run: |
                  sed -i 's/^org.gradle.jvmargs=.*/org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m/' gradle.properties
                  ./gradlew :app:assembleRelease \
                      -PreactNativeArchitectures="$ARCHS" \
                      -PrnllamaVariants="$RNLLAMA_VARIANTS" \
                      --no-daemon
                  df -h / | tail -n 1

            - name: Collect APK
              id: collect
              run: |
                  VERSION=$(node -p "require('./app.config.js').expo.version")
                  ARCH_TAG=$(echo "$ARCHS" | tr ',' '-')
                  mkdir -p dist
                  APK=$(ls android/app/build/outputs/apk/release/*.apk | head -n 1)
                  OUT="dist/relay-mobile-v${VERSION}-${ARCH_TAG}.apk"
                  cp "$APK" "$OUT"
                  # Paths in later steps are relative to the repository root.
                  echo "apk=apps/relay-mobile/$OUT" >> "$GITHUB_OUTPUT"
                  ls -la dist

            - name: Upload APK artifact
              uses: actions/upload-artifact@v4
              with:
                  name: ${{ github.ref_type == 'tag' && format('relay-mobile-{0}', github.ref_name) || 'relay-mobile-apk' }}
                  path: ${{ steps.collect.outputs.apk }}
                  if-no-files-found: error

            - name: Attach APK to release
              if: ${{ github.ref_type == 'tag' }}
              uses: softprops/action-gh-release@v2
              with:
                  files: ${{ steps.collect.outputs.apk }}
