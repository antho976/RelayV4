name: Release

# A tag v* (or a manual run) becomes a GitHub Release with an installable APK, gated on the full CI
# pipeline running against that exact commit.
#
# Signing: with the four TALLY_* secrets set, the APK is signed with the real upload key. Without
# them it is signed with a throwaway debug key and the release is marked a pre-release, so a test
# build can never be mistaken for one that can update a store install.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ci:
    uses: ./.github/workflows/ci.yml
    with:
      ref: ${{ github.sha }}

  publish:
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: true
      - name: Install the Android platform
        run: |
          sdkmanager="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$sdkmanager" --licenses > /dev/null 2>&1 || true
          "$sdkmanager" "platforms;android-37.0" > /dev/null
      - name: Write the keystore, when one is configured
        id: keys
        env:
          KEYSTORE_B64: ${{ secrets.TALLY_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.TALLY_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.TALLY_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.TALLY_KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_B64" ] && [ -n "$STORE_PASSWORD" ] && [ -n "$KEY_ALIAS" ] && [ -n "$KEY_PASSWORD" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/upload.jks"
            {
              echo "storeFile=$RUNNER_TEMP/upload.jks"
              echo "storePassword=$STORE_PASSWORD"
              echo "keyAlias=$KEY_ALIAS"
              echo "keyPassword=$KEY_PASSWORD"
            } > keystore.properties
            echo "signed=true" >> "$GITHUB_OUTPUT"
          else
            echo "signed=false" >> "$GITHUB_OUTPUT"
            echo "::warning::No signing secrets: publishing a debug-signed pre-release."
          fi
      # One name for the tag and the APK, worked out once. A manual run from a branch such as
      # claude/xyz gets build-N, and any slash left in a name is replaced, since the APK is a file
      # name and "tally-claude/xyz.apk" would point into a directory that does not exist. The ref
      # comes in through env, never pasted into the script, so a branch name cannot run as shell.
      - name: Name the release
        id: name
        env:
          REF_NAME: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          if [ "$REF_TYPE" = "tag" ]; then tag="$REF_NAME"; else tag="build-$RUN_NUMBER"; fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "apk=tally-${tag//\//-}.apk" >> "$GITHUB_OUTPUT"
      - name: Build the release APK
        env:
          SIGNED: ${{ steps.keys.outputs.signed }}
          APK_NAME: ${{ steps.name.outputs.apk }}
        run: |
          if [ "$SIGNED" = "true" ]; then
            ./gradlew :app:assembleRelease
          else
            ./gradlew :app:assembleRelease -PtallyCiSmokeSigning
          fi
          apk=$(find app/build/outputs/apk/release -name '*.apk' -not -name '*unsigned*' | head -1)
          if [ -z "$apk" ]; then echo "::error::No signed release APK was built."; exit 1; fi
          cp "$apk" "$APK_NAME"
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          SIGNED: ${{ steps.keys.outputs.signed }}
          TAG: ${{ steps.name.outputs.tag }}
          APK_NAME: ${{ steps.name.outputs.apk }}
          SHA: ${{ github.sha }}
        run: |
          flags=""
          if [ "$SIGNED" != "true" ]; then flags="--prerelease"; fi
          gh release create "$TAG" "$APK_NAME" --target "$SHA" \
            --title "Tally $TAG" --notes "Built from $SHA." $flags
      - name: Remove the keystore
        if: always()
        run: rm -f keystore.properties "$RUNNER_TEMP/upload.jks"
