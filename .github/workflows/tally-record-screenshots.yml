name: Tally Record screenshot goldens and Room schema

# Re-records app/src/test/screenshots on a branch and commits them back. Run it deliberately when a
# screen changed on purpose, then LOOK at the diff in the commit before trusting the new goldens:
# a changed golden is a question, not a chore.

on:
  workflow_dispatch:

permissions:
  contents: write

# Tally lives in apps/tally; every `run` step starts there. `uses` steps ignore this default, so
# their paths name apps/tally themselves.
defaults:
  run:
    working-directory: apps/tally

jobs:
  record:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6
        with:
          cache-read-only: true
      - name: Install the Android platform
        run: |
          sdkmanager="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$sdkmanager" --licenses > /dev/null 2>&1 || true
          "$sdkmanager" "platforms;android-37.0" > /dev/null
      - name: Record
        run: ./gradlew :app:recordRoborazziDebug
      - name: Export the Room schema
        # The schema JSON is a side output of KSP that the build cache does not restore, so a
        # cached compile writes nothing; --rerun forces the processor to run and export it.
        run: ./gradlew :app:kspDebugKotlin --rerun
      - name: Commit the goldens and schema
        run: |
          git config user.name "tally-ci"
          git config user.email "tally-ci@users.noreply.github.com"
          git add app/src/test/screenshots
          if [ -d app/schemas ]; then git add app/schemas; fi
          if git diff --cached --quiet; then echo "Goldens unchanged."; exit 0; fi
          git commit -m "Record screenshot goldens and Room schema"
          # The branch may have moved while this ran; these files touch nothing else, so a
          # rebase onto it is safe.
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
