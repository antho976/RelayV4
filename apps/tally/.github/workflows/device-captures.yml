name: Device captures

# Real emulator screenshots of Home, committed to .impeccable/captures for the design finish
# review. The review asks about the shell around the screen: the status bar, the raised navigation
# bar and its indicator pill, the add FAB, the system insets. Robolectric goldens draw none of that.
#
# Run it deliberately when the shell changed. The captures are evidence for a reviewer, not
# goldens: nothing compares against them, and PROVENANCE.md says which build and devices made them.

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  capture:
    name: Capture (phone, tablet)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      # The emulator refuses to boot when it cannot allocate its userdata partition, and the
      # Gradle cache, the build and the system image leave a stock runner about 6 GB short.
      # Drop the toolchains this job never uses before anything is restored.
      - name: Free runner disk for the emulator
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /usr/local/share/boost \
            /usr/share/swift /usr/local/lib/node_modules /opt/hostedtoolcache/CodeQL \
            /usr/local/share/powershell /usr/local/share/chromium || true
          sudo docker image prune --all --force > /dev/null 2>&1 || true
          df -h /
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.ref }}
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: true
      - name: Install the Android platform
        run: |
          sdkmanager="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$sdkmanager" --licenses > /dev/null 2>&1 || true
          "$sdkmanager" "platforms;android-37.0" > /dev/null
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Build the debug app and its test APK (before an emulator boots)
        run: ./gradlew :app:assembleDebug :app:assembleDebugAndroidTest
      # A fresh AVD per device on a named hardware profile, booted cold with no snapshot: each
      # capture is a clean install on a real screen size, not CI's cached generic AVD.
      - name: Phone (Pixel 7), then at the 200% font scale
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_7
          avd-name: phone
          cores: 4
          ram-size: 4096M
          disk-size: 3G
          force-avd-creation: true
          disable-animations: true
          emulator-options: -no-snapshot -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash .github/scripts/capture.sh phone
      - name: Tablet (Pixel Tablet)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_tablet
          avd-name: tablet
          cores: 4
          ram-size: 4096M
          disk-size: 3G
          force-avd-creation: true
          disable-animations: true
          emulator-options: -no-snapshot -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash .github/scripts/capture.sh tablet
      - name: Commit the captures
        shell: bash
        run: |
          set -euo pipefail
          built=$(git rev-parse HEAD)
          mkdir -p .impeccable/captures
          cp captures/*.png .impeccable/captures/
          {
            echo "# Device captures"
            echo
            echo "Emulator screenshots of Home with its real system bars, for the design finish review."
            echo "Written by \`.github/workflows/device-captures.yml\`; run it again rather than editing these."
            echo
            echo "- Run: [${GITHUB_RUN_ID}](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID})"
            echo "- Commit: \`${built}\` on \`${GITHUB_REF_NAME}\`"
            echo "- Build: debug APK, sample data loaded through first run, system animations off"
            echo "- Status bar: SystemUI demo mode (fixed clock, full battery and signal, no notification icons)"
            echo
            echo "| File | Device profile | Image | Font scale |"
            echo "| --- | --- | --- | --- |"
            echo "| phone.png | pixel_7 | API 34 google_apis x86_64 | 1.0 |"
            echo "| phone-200.png | pixel_7 | API 34 google_apis x86_64 | 2.0 |"
            echo "| tablet.png | pixel_tablet | API 34 google_apis x86_64 | 1.0 |"
            echo
            echo "## Displays as the devices reported them"
            echo
            echo '```'
            cat captures/display-*.txt
            echo '```'
          } > .impeccable/captures/PROVENANCE.md
          git config user.name "tally-ci"
          git config user.email "tally-ci@users.noreply.github.com"
          git add .impeccable/captures
          if git diff --cached --quiet; then echo "Captures unchanged."; exit 0; fi
          git commit -m "Record device captures"
          # The branch may have moved while this ran; these files touch nothing else, so a
          # rebase onto it is safe.
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
      - name: Upload the captures
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: device-captures
          path: captures/
          if-no-files-found: warn
          retention-days: 30
