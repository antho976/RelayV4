[package]
name = "relay-remote"
description = "Relay's remote door: the bus over WebSocket for a paired phone, on the LAN or through a self-hosted rendezvous server."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
relay-bus.workspace = true
relay-core.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true
anyhow.workspace = true
thiserror.workspace = true
sha2.workspace = true
rand.workspace = true
jiff.workspace = true
tokio-tungstenite = { version = "0.30", features = ["rustls-tls-native-roots"] }
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
qrcode = { version = "0.14", default-features = false }
if-addrs = "0.15"

[dev-dependencies]
tempfile = "3"
